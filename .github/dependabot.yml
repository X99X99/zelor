# Surveillance des dépendances.
#
# Remplace le contrôle `dependency-review`, qui exige GitHub Advanced Security
# sur un dépôt privé. Dependabot, lui, est gratuit et fait mieux pour ce projet :
# la revue ne gardait que la porte d'entrée des pull requests, alors qu'ici tous
# les commits arrivent en push direct. Dependabot surveille l'arbre entier, en
# continu, et propose lui-même la correction.
#
# Les alertes de sécurité s'activent en plus dans Settings → Security.

version: 2
updates:
  # Les bibliothèques du site ne sont volontairement pas suivies ici.
  #
  # Ce projet verrouille ses versions dans `bun.lock`, et Dependabot ne sait pas
  # le régénérer : il met à jour `package.json` seul. Le contrôle qualité, qui
  # installe avec `--frozen-lockfile`, refuse alors le désaccord entre les deux
  # fichiers. Chaque demande de fusion arrivait rouge et inmergeable — du
  # travail qui s'accumule sans jamais rien protéger.
  #
  # Les alertes Dependabot, elles, continuent de signaler les failles connues :
  # elles lisent le graphe de dépendances, pas le lockfile. La mise à jour se
  # fait alors à la main, en une commande, avec le lockfile régénéré.
  #
  # À rétablir le jour où Dependabot saura écrire dans `bun.lock`.

  # Actions du contrôle qualité. Elles vieillissent sans qu'on y pense, et
  # c'est ainsi qu'on se retrouve averti que Node 20 n'est plus maintenu.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
