# Chemin qualité ZELOR — miroir de `bun run preflight`.
# Ce workflow doit être autorisé manuellement dans GitHub (Settings → Actions),
# et ses checks exigés dans la protection de branche (voir QUALITY_GUARDRAILS.md).
name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Le rendu de référence est verrouillé : on installe le navigateur de
      # test attendu par le projet, jamais un Chromium système arbitraire.
      - run: bunx playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # Revue des dépendances : refuse toute bibliothèque entrante porteuse d'une
  # faille connue de gravité élevée.
  #
  # L'action compare deux états du projet. Sur une pull request, elle trouve
  # seule quoi comparer. Sur un push direct, il faut lui désigner les deux
  # points : le commit d'avant, et celui qui arrive.
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          base-ref:
            ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
          head-ref: ${{ github.sha }}
